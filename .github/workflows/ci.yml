name: Fizahana Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    name: Fanamarinana ny Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Maka ny kaody avy amin'ny GitHub
        uses: actions/checkout@v4

      - name: Manamarina ireo rakitra fototra
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/script.js
          echo "Tafita ny fanamarinana ireo rakitra fototra."

      - name: Manamboatra ny Docker image
        run: docker build -t school-international-training:test .
